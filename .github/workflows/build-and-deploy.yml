name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CHECKSUM: 3d3a516e8d818e022b25ec514eaebb3737d6e36cd3c1e7c70e82a1b2d075862b
      FILENAME: _book/Quantifying-the-Flow-of-Information.pdf

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render website with Quarto
        run: quarto render

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      # The HTML is built with `html-math-method: mathml`; formel then converts every equation to
      # an SVG (drawn in currentColor) so the output does not depend on the reader's math fonts.
      # formel is built from the commit pinned in .github/formel-version.txt — bump that file to
      # move to a newer formel.
      - name: Read formel version
        id: formel
        run: echo "sha=$(grep -v '^#' .github/formel-version.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Cache formel wasm and math font
        id: formel-cache
        uses: actions/cache@v6
        with:
          path: .formel
          key: formel-${{ steps.formel.outputs.sha }}

      - name: Build formel
        if: steps.formel-cache.outputs.cache-hit != 'true'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.100 --locked
          git clone https://github.com/manuel-rhdt/formel formel-src
          git -C formel-src checkout "${{ steps.formel.outputs.sha }}"
          cd formel-src
          cargo build -p formel-wasm --target wasm32-unknown-unknown --release
          wasm-bindgen --target web --no-typescript --out-dir ../.formel/pkg \
            target/wasm32-unknown-unknown/release/formel_wasm.wasm
          mkdir -p ../.formel/fonts
          cp web/fonts/lisnoti-regular.ttf ../.formel/fonts/

      - name: Render equations as SVG
        run: node scripts/formel-math.mjs _book .formel

      - name: Cache PDF thesis
        id: cache-pdf
        uses: actions/cache@v6
        with:
          path: ${{ env.FILENAME }}
          key: pdf-${{ env.CHECKSUM }}

      - name: Download PDF thesis
        if: steps.cache-pdf.outputs.cache-hit != 'true'
        run: curl -L https://ir.amolf.nl/pub/11167/2025-PhD-Thesis-Manuel-Reinhardt.pdf -o $FILENAME

      - name: Verify checksum
        run: | 
            echo "$CHECKSUM  $FILENAME" | tee checksum.sha256
            sha256sum -c checksum.sha256
            rm checksum.sha256

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_book'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
