name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CHECKSUM: 3d3a516e8d818e022b25ec514eaebb3737d6e36cd3c1e7c70e82a1b2d075862b
      FILENAME: _book/Quantifying-the-Flow-of-Information.pdf

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render website with Quarto
        run: quarto render

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The HTML is built with `html-math-method: mathml`; formel then converts every equation to
      # an SVG so the output does not depend on the reader's math fonts. Pinned in
      # .github/formel-checksums.txt — bump that file to move to a newer formel build.
      - name: Cache formel wasm and math font
        uses: actions/cache@v4
        with:
          path: .formel
          key: formel-${{ hashFiles('.github/formel-checksums.txt') }}

      - name: Fetch formel
        run: |
          mkdir -p .formel/pkg .formel/fonts
          [ -s .formel/pkg/formel_wasm.js ] || curl -fsSL -o .formel/pkg/formel_wasm.js https://manuel-rhdt.github.io/formel/pkg/formel_wasm.js
          [ -s .formel/pkg/formel_wasm_bg.wasm ] || curl -fsSL -o .formel/pkg/formel_wasm_bg.wasm https://manuel-rhdt.github.io/formel/pkg/formel_wasm_bg.wasm
          [ -s .formel/fonts/newcomputermodern-math.otf ] || curl -fsSL -o .formel/fonts/newcomputermodern-math.otf https://manuel-rhdt.github.io/formel/fonts/newcomputermodern-math.otf
          sha256sum -c .github/formel-checksums.txt

      - name: Render equations as SVG
        run: node scripts/formel-math.mjs _book .formel

      - name: Cache PDF thesis
        id: cache-pdf
        uses: actions/cache@v4
        with:
          path: ${{ env.FILENAME }}
          key: pdf-${{ env.CHECKSUM }}

      - name: Download PDF thesis
        if: steps.cache-pdf.outputs.cache-hit != 'true'
        run: curl -L https://ir.amolf.nl/pub/11167/2025-PhD-Thesis-Manuel-Reinhardt.pdf -o $FILENAME

      - name: Verify checksum
        run: | 
            echo "$CHECKSUM  $FILENAME" | tee checksum.sha256
            sha256sum -c checksum.sha256
            rm checksum.sha256

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_book'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
